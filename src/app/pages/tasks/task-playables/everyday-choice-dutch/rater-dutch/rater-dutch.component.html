<div class="wrapper">
    <!-- Start Practice Round -->
    <div *ngIf="showStimulus" class="full-box flex-column-center">
        <div class="activity-container flex-column-center">
            <span class="activity">{{ getTranslation(activityShown) }}</span>
        </div>
        <div class="question-container flex-column-center">
            <span class="question">{{ getTranslation(questionShown) }}</span>
        </div>
        <div class="slider-container">
            <ng-container *ngIf="showSlider">
                <div *ngIf="isPractice" class="text-center hint py-3">
                    {{ practiceHelpMessage }}
                </div>
                <ng-container *ngIf="isCurrentQuestionMultiPart; else ratingSlider">
                    <app-option-display
                        question=""
                        [options]="binaryChoiceOptions"
                        (onSelectValue)="handleRoundInteraction($event)"
                    ></app-option-display>
                </ng-container>
                <ng-template #ratingSlider>
                    <app-slider
                        [shouldReverseLegend]="shouldReverse"
                        [marks]="currentSliderMarks"
                        (sliderValueSelected)="handleRoundInteraction($event)"
                    ></app-slider>
                    <div class="flex-row-space-around next-button-row">
                        <button
                            class="next-button-text"
                            [class.next-button-hidden]="!showNextButton"
                            [disabled]="!showNextButton"
                            style="padding: 0.25rem 1rem"
                            (click)="completeRound()"
                            mat-raised-button
                            color="primary"
                        >
                            {{ 'buttons.next' | translate }} &nbsp;
                            <mat-icon>arrow_forward</mat-icon>
                        </button>
                    </div>
                </ng-template>
            </ng-container>
        </div>
    </div>
</div>
